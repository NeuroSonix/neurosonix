<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/faviconround.ico">
  
<style>
:root{
  --bg:#000000;
  --text:#ffffff;
  --muted:rgba(255,255,255,.66);
  --soft:rgba(255,255,255,.46);
  --border:rgba(255,255,255,.10);
  --panel:rgba(255,255,255,.04);
  --accent:#def962;
  --accent-bg:rgba(222,249,98,.12);
  --accent-border:rgba(222,249,98,.35);
}

*{box-sizing:border-box}

.email-link{
  color:var(--text);
  text-decoration:none;
  transition:color .2s ease;
  border-bottom:1px solid transparent;
}

.email-link:hover{
  color:var(--accent);
  border-bottom:1px solid var(--accent);
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

.container{
  max-width:1180px;
  margin:0 auto;
  padding:0 28px;
}

.site-header{
  border-bottom:1px solid var(--border);
  background:#000;
}

.header-inner{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  min-height:72px;
}

.nav{
  display:flex;
  gap:30px;
  flex-wrap:wrap;
}

.nav a{
  text-decoration:none;
  color:var(--soft);
  cursor:pointer;
  font-size:14px;
  font-weight:400;
  letter-spacing:.01em;
  padding:0;
}

.nav a:hover,
.nav a.active{
  color:var(--text);
}

.page{
  padding:84px 0 88px;
}

h2{
  margin:0;
  font-size:clamp(1.9rem,4vw,2.7rem);
  line-height:1.12;
  letter-spacing:-.02em;
  font-weight:300;
  max-width:900px;
}

p{
  color:var(--muted);
  font-size:1rem;
  line-height:1.7;
  font-weight:400;
}

.footer{
  border-top:1px solid var(--border);
  margin-top:72px;
  padding:56px 0;
  text-align:center;
}

.footer-brand{
  font-size:12px;
  font-weight:400;
  letter-spacing:.24em;
  opacity:.88;
}

.footer-copy{
  margin-top:10px;
  font-size:12px;
  color:var(--soft);
}

@media (max-width:900px){
  .nav{
    gap:16px;
  }

  .page{
    padding:56px 0 68px;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/technology/">Technology</a>
      <a href="/contact/" class="active">Contact</a>
    </nav>
  </div>
</header>

<section class="page">
  <div class="container">

    <h2>Contact</h2>

    <p>
      <a href="mailto:info@neurosonix.ai" class="email-link">
        info@neurosonix.ai
      </a>
    </p>

  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-brand">NEUROSONIX</div>
    <div class="footer-copy">© 2026 NeuroSonix</div>
  </div>
</footer>

</body>
</html>
